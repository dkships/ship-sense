# Pre-registered comparison families (METHODOLOGY.md, "Statistics").
#
# Each bench version declares, BEFORE its run is scored, which paired tests are
# confirmatory. `make pairwise` reads the block for the run's version.
#
#   confirmatory  Holm-corrected within this family only. Adding an unrelated
#                 model cannot move a confirmatory verdict.
#     successions: all   (v3.6-v4.1) every succession on the board, derived by the
#                        rule the leaderboard uses (same lineage, higher ranked
#                        version, or an explicit superseded_by in models.yaml).
#                        A model that creates a NEW succession grows the family and
#                        can raise the Holm p-value of every registered test with a
#                        smaller raw p (Claude Sonnet 5.5 moved the GPT-6 Luna claim
#                        from 2.0e-5 to 2.5e-5 on v4.1; no verdict changed).
#     successions: [{prev, curr}, ...]   (v4.2+) the registered list, fixed. A
#                        succession that appears after registration, or a claim
#                        appended later with `added: <date>`, is tested as its own
#                        family of one, so no addition can move a registered verdict.
#     claims             named vendor-claim pairs: a launch claim that model `a`
#                        is at least as good as, or better than, model `b`.
#                        A pair whose models are not both on the board is
#                        reported as untested, never silently dropped.
#   exploratory   all_pairs: every pair on the board, reported with
#                 Benjamini-Hochberg q-values and labelled exploratory.
#
# Never edit a version's block after its scores exist; add a new version instead.

