        - a: gpt-6.1-sol
          b: gpt-6-astra
          added: "2026-09-29"
          claim: '"Nearly matches GPT-6 Astra''s intelligence on agentic coding, computer use, and professional work." (GPT-6.1 Sol launch; tested at shipped defaults)'
