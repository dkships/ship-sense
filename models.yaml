    label: "GPT-5.6 Sol"
    released: "2026-07-09"       # openai.com/index/gpt-5-6 (GA; limited preview from 2026-06-26)
    price_in: 4                  # cut from $5/$30 on 2026-08-24 (-20% in / -33% out); scored at the old price
