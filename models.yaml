    structured_outputs: true
    batch_supported: true      # re-probed 2026-07-31: the Batch API now accepts it
    batch_discount: 0.5
    price_verified: "2026-08-24"
    price_source: "https://developers.openai.com/api/docs/pricing"
    # NOT an announced revert — OpenAI published an END DATE for the promotional
    # guarantee, not a new price. The numbers below are the PRE-promotional
