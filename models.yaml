    migration_target: responses
    structured_outputs: true
    batch_supported: true        # probed 2026-09-04 against the Batch API itself, not read off the docs
    batch_discount: 0.5          # pricing page lists batch at $5 / $25 — exactly 50% off
    price_verified: "2026-09-04"
    price_source: "https://developers.openai.com/api/docs/pricing"
