  # --- xAI (OpenAI-compatible endpoint; https://api.x.ai/v1) ---
  # xAI is NOT a capability ladder. Where the other labs ship a flagship/mid/cheap
  # spread, xAI ships one frontier model with reasoning-effort dials. So this is
  # new-vs-previous, and the line is now three deep: 4.6 -> 4.5 -> 4.3.
  # REASONING EFFORT, re-read 2026-08-12 (the docs have MOVED since 2026-07-08):
  # the model-capabilities page now says "`grok-4.6` and `grok-4.5` support the
  # `reasoning_effort` parameter... If not specified, `reasoning_effort` defaults
  # to `"high"`. Reasoning cannot be disabled." The Chat Completions REST reference
  # still carries the older "Only supported by `grok-4.3`" line — xAI contradicts
  # itself, and it does not matter here because the harness sets no effort at all.
  # What matters is the DEFAULT each model ships:
  #   grok-4.6 -> high   grok-4.5 -> high   grok-4.3 -> low
  # So 4.6-vs-4.5 is a CLEAN A/B at shipped defaults — the effort confound
  # disclosed in FINDINGS applies to 4.5-vs-4.3 ONLY, and that disclosure stays
  # exactly as published. `xhigh` exists on 4.6 (and is silently downgraded to
  # `high` on 4.5) but is NOT the default, so it is never set — same ruling as
  # Meta's launch numbers: a launch benchmark and a default are different
  # measurements, and we publish the default.
  # `max_completion_tokens` bounds only VISIBLE output on xAI — reasoning tokens are
  # unbounded and bill as output. There is no cost ceiling; gate spend before a run.
  # BATCH IS NOW IMPOSSIBLE FOR 4.6 AND 4.5, and the reason CHANGED on 2026-08-12.
  # It used to be economic (batch accepted grok-4.5 at a 0% discount, so live was
  # simpler). It is now a hard rejection: the docs warn "`grok-4.6` and `grok-4.5`
  # are not currently supported for Batch API requests and will be rejected", and
  # the API agrees — POST /v1/batches/{id}/requests with grok-4.6 returns 400
  # "Model grok-4.6 is not supported for batch processing." The control ran on the
  # identical call: grok-4.3 was ACCEPTED (200) and billed 2377200 ticks against
  # 2971500 at list = exactly 0.80, i.e. its documented 20% discount, measured to
  # the tick. So the endpoint and the account are fine and the rejection is the
  # model. Re-probe with notes/batch_probe.py (xai dialect) before each run.
  # CONSEQUENCE: `make batch-prepare` and notes/run_batch.py skip these entries
  # silently (src/batch.py). Official runs of the grok line must run LIVE.
  # Prompt caching (cached input $0.50 / $0.30 / $0.20) evaluated and declined:
  # input is ~10% of spend. It needs no header plumbing — `prompt_cache_key` is a
  # plain body param. Never set `service_tier: "priority"` — it bills at 2x.
  - name: grok-4.6
    provider: xai
    id: grok-4.6
    base_url: https://api.x.ai/v1
    label: "Grok 4.6"            # spaced so `_lineage` reads version 4.6 and retires "Grok 4.5"
    released: "2026-08-12"       # DAVID CONFIRMED launch day 2026-08-12, so this model was scored
                                 # the day it shipped. It replaces a placeholder of 2026-08-06 that
                                 # came from the API's `created`, which ran SIX days early here —
                                 # the same trap as grok-4.5, where `created` led the announcement
