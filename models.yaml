  # --- OpenAI (all reasoning models: max_completion_tokens, no temperature) ---
  # Responses API is the migration target for frontier GPT models; the current
  # adapter remains Chat Completions-compatible and uses json_schema Structured
  # Outputs there, which the current docs also support.
  # GPT-5.6 is a flagship/mid/cheap ladder: Sol / Terra / Luna. `gpt-5.6` is an
  # ALIAS for Sol — pin the concrete id so the board can never silently re-point.
  # Launch-day blogs claimed a new `max` reasoning effort and an `ultra` subagent
  # mode; the API docs list neither (only none/minimal/low/medium/high/xhigh), and
  # the harness sets no effort anyway. Do not encode them.
  # Preview-gated for most of 2026-07-09 ("in limited preview and is not available
  # on this account"), then opened mid-session. Chat Completions reported a bare
  # `model_not_found` the whole time; only /v1/responses gave the real reason —
  # probe THERE first when a new id 404s.
  # BATCH: NOW SUPPORTED (re-probed 2026-07-31, one batch per model, all three
  # cleared validation on /v1/responses — the endpoint src/batch.py actually
  # submits to). The pricing page lists a batch row for each at exactly 50% off,
  # so batch_discount: 0.5. All three are back in notes/run_batch.py.
  # History worth keeping: on 2026-07-09 the validator rejected all three with
  # "The provided model 'gpt-5.6-sol' is not supported by the Batch API" while
  # the per-model doc pages claimed Batch worked. The docs led the rollout by
  # three weeks. That is why eligibility is probed, never read — keep probing
  # before each official run, in both directions.
  # PROBE ONE MODEL PER BATCH. OpenAI rejects a mixed batch with "The model for
  # this request does not match the rest of the batch", which the old probe
  # reported as "NOT batchable" for every model after the first — a false
  # negative that would have kept batchable models running live at full price.
  # notes/batch_probe.py was fixed on 2026-07-31 to submit one batch per model.
  # GPT-6 Astra — registered 2026-09-04, two days after the 2026-09-03 announce.
  # PROBED BEFORE WIRING (notes/astra_probe.py, 2026-09-04) and all four checks
  # came back green on this key: chat.completions answered, /v1/responses
  # answered, strict json_schema was honoured, and the Batch API ACCEPTED a
  # /v1/responses job (admitted, then cancelled — the probe tests admission, not
  # completion). So Astra does NOT repeat the gpt-5.6 story where the docs led
  # the batch rollout by three weeks; it was batchable on day two. Re-probe
  # anyway before the official run — eligibility is probed, never read.
  # AVAILABILITY, because these two gate SEPARATELY and it is easy to conflate:
  # a ChatGPT plan tier ($100/mo Pro, which is where Astra showed up first) is
  # NOT what makes this entry runnable. The API key in .env is, and that key
  # lists gpt-6-astra among 133 visible models as of 2026-09-04.
